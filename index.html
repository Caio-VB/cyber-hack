<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber-Hack: Invasão Mobile</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --primary: #00ff66;
            --primary-glow: rgba(0, 255, 102, 0.4);
            --bg-dark: #010503;
            --panel-bg: rgba(2, 15, 8, 0.9);
            --danger: #ff3355;
            --warning: #ffcc00;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Share Tech Mono', monospace;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            color: var(--primary);
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* UI do Jogo */
        #hud-top {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        #score-panel {
            background: var(--panel-bg);
            border: 1px solid var(--primary);
            padding: 4px 8px; /* Sobra removida */
            font-size: 14px;
            box-shadow: 0 0 10px var(--primary-glow);
            border-radius: 0;
            display: inline-block; /* Fica justo ao conteúdo */
            white-space: nowrap;
            line-height: 1.1; /* Remove sobra vertical */
            height: max-content;
        }

        #ranking-panel {
            background: var(--panel-bg);
            border: 1px solid var(--primary);
            padding: 8px;
            width: 140px;
            font-size: 10px;
            box-shadow: 0 0 10px var(--primary-glow);
            border-radius: 0;
        }

        #ranking-panel h3 {
            margin: 0 0 5px 0;
            font-size: 12px;
            text-align: center;
            border-bottom: 1px dashed var(--primary);
            padding-bottom: 4px;
        }

        #ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #ranking-list li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #hud-bottom {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 25px);
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        /* Tutorial Modificado - Neutro e Transparente */
        .instructions {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6) !important; /* Branco translúcido para tirar o verde */
            background-color: transparent !important;
            text-shadow: 1px 1px 2px #000; 
            padding: 0;
            display: inline-block;
            font-weight: bold;
            border: none !important;
            box-shadow: none !important;
            letter-spacing: 1px;
        }

        /* Telas de Overlay */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(1, 8, 4, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }

        .overlay-screen h1 {
            font-size: 36px;
            color: var(--danger);
            margin: 0 0 10px 0;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 51, 85, 0.5);
        }

        .overlay-screen p {
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            max-width: 280px;
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 15px;
            font-size: 18px;
            font-family: 'Share Tech Mono', monospace;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
            -webkit-appearance: none;
            border-radius: 0;
        }

        input:focus {
            box-shadow: 0 0 15px var(--primary-glow);
            background: rgba(0, 255, 102, 0.1);
        }

        button {
            width: 100%;
            max-width: 280px;
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 16px;
            font-size: 18px;
            font-family: 'Share Tech Mono', monospace;
            margin-top: 10px;
            font-weight: bold;
            border-radius: 0;
        }

        button:active {
            background: var(--primary);
            color: var(--bg-dark);
        }

        #error-msg {
            color: var(--danger);
            font-size: 12px;
            margin-top: 15px;
            min-height: 15px;
        }

        .stats-box {
            background: rgba(0, 255, 102, 0.03);
            border: 1px dashed var(--primary);
            padding: 15px;
            margin: 20px 0;
            width: 100%;
            max-width: 280px;
            text-align: left;
            font-size: 14px;
        }

        .stats-box span { color: var(--warning); float: right; }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay-screen">
        <h1>CYBER-HACK</h1>
        <p>> INVASÃO MOBILE_</p>
        <input type="text" id="nickname-input" placeholder="NICKNAME" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="none">
        <input type="password" id="password-input" placeholder="SENHA" maxlength="12">
        <button id="start-btn">CONECTAR</button>
        <div id="error-msg"></div>
    </div>

    <div id="hud-top" style="display: none;">
        <div id="score-panel"><span id="score">0</span> TB</div>
        <div id="ranking-panel">
            <h3>TOP HACKERS</h3>
            <ul id="ranking-list"><li>Carregando...</li></ul>
        </div>
    </div>

    <div id="hud-bottom" style="display: none;">
        <div class="instructions">ARRASTAR = Guiar | 2 TOQUES = Dash</div>
    </div>
    
    <div id="game-over" class="overlay-screen" style="display: none;">
        <h1>SISTEMA PURGADO</h1>
        <div class="stats-box">
            <p>DADOS EXTRAÍDOS NESSA SESSÃO: <span id="go-score">0</span></p>
            <p>SEU RECORDE PESSOAL: <span id="go-personal-best">0</span></p>
            <p>RECORDE GLOBAL DO JOGO: <span id="go-global-best">0</span></p>
        </div>
        <button id="restart-btn">REINICIAR INVASÃO</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGBcZWWav3uxZBPalg9GKLolQH_J18L0s",
            authDomain: "cyber-hack-c0f4d.firebaseapp.com",
            projectId: "cyber-hack-c0f4d",
            storageBucket: "cyber-hack-c0f4d.firebasestorage.app",
            messagingSenderId: "596437872153",
            appId: "1:596437872153:web:44c704bd8e0ae033d10488",
            measurementId: "G-MXY6VMK1N2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myNickname = "";
        let playerDocRef = null;
        let personalBest = 0;
        let globalBest = 0;
        let gameState = 'LOGIN';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreEl = document.getElementById('score');
        const rankingList = document.getElementById('ranking-list');
        const hudTop = document.getElementById('hud-top');
        const hudBottom = document.getElementById('hud-bottom');

        let width, height;
        const BASE_SEGMENTS = 8;     
        const BASE_SPEED = 4.0;      
        const DASH_SPEED = 8.0;
        const MAGNET_RADIUS = 60; 
        const GRID_SIZE = 50;        
        const MAX_FOOD = 500000; // Quantidade de alimento triplicada      
        const MAX_BOTS = 25;  // Quantidade de inimigos aumentada       

        const player = { x: 0, y: 0, radius: 8, speed: BASE_SPEED, segments: [], score: 0 };
        let camera = { x: 0, y: 0 };
        let target = { x: 0, y: 0 };
        let isDashing = false;

        let tapTimes = [];
        const DASH_TAP_WINDOW = 350; 

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        canvas.addEventListener('touchstart', (e) => {
            if (gameState !== 'PLAYING') return;
            e.preventDefault(); 
            
            const now = Date.now();
            tapTimes.push(now);
            if (tapTimes.length > 2) tapTimes.shift();

            if (tapTimes.length >= 2 && (now - tapTimes[tapTimes.length - 2] < DASH_TAP_WINDOW)) {
                isDashing = true;
            } 
            else if (e.touches.length === 1) {
                const touch = e.touches[0];
                target.x = camera.x + touch.clientX;
                target.y = camera.y + touch.clientY;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (gameState !== 'PLAYING') return;
            e.preventDefault();
            const touch = e.touches[0];
            target.x = camera.x + touch.clientX;
            target.y = camera.y + touch.clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (e.touches.length === 0) {
                isDashing = false;
            }
        }, { passive: false });

        canvas.addEventListener('touchcancel', () => { isDashing = false; });

        document.getElementById('start-btn').addEventListener('click', async () => {
            const nick = document.getElementById('nickname-input').value.trim().toUpperCase();
            const pass = document.getElementById('password-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('start-btn');

            if (nick.length < 3 || pass.length < 3) {
                errorMsg.innerText = "Mínimo de 3 caracteres."; return;
            }

            errorMsg.innerText = "Conectando...";
            btn.disabled = true;

            try {
                const docRef = db.collection("players").doc(nick);
                const doc = await docRef.get();

                if (doc.exists) {
                    if (doc.data().password === pass) {
                        initGameData(nick, docRef, doc.data().bestScore || 0);
                    } else {
                        errorMsg.innerText = "Senha incorreta!";
                        btn.disabled = false;
                    }
                } else {
                    await docRef.set({
                        nickname: nick, password: pass, score: 0, bestScore: 0,
                        lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    initGameData(nick, docRef, 0);
                }
            } catch (e) {
                errorMsg.innerText = "Erro de rede.";
                btn.disabled = false;
            }
        });

        function initGameData(nick, docRef, best) {
            myNickname = nick;
            playerDocRef = docRef;
            personalBest = best;
            document.getElementById('login-screen').style.display = 'none';
            hudTop.style.display = 'flex';
            hudBottom.style.display = 'block';
            resetGame();
            initRealtimeRanking();
            setInterval(heartbeat, 10000);
        }

        document.getElementById('restart-btn').addEventListener('click', () => {
            resetGame();
        });

        let foods = [];
        let particles = [];
        let bots = [];
        const codeSymbols = ['0', '1', '{', '}', ';', '=>', 'if', '[]'];

        function resetGame() {
            player.x = 0; player.y = 0; player.score = 0; player.segments = [];
            isDashing = false; tapTimes = [];
            
            for (let i = 0; i < BASE_SEGMENTS; i++) {
                player.segments.push({ x: player.x, y: player.y });
            }
            scoreEl.innerText = "0";
            updateFirebaseScore(); 
            
            foods = []; bots = []; particles = [];
            for (let i = 0; i < MAX_FOOD; i++) spawnFood();
            while (bots.length < MAX_BOTS) bots.push(new Bot());

            gameState = 'PLAYING';
            document.getElementById('game-over').style.display = 'none';
        }

        function spawnFood(x, y, isDrop = false) {
            if (x === undefined) {
                const maxDim = Math.max(width, height);
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (maxDim * 10); // Espalha mais amplamente
                x = player.x + Math.cos(angle) * dist;
                y = player.y + Math.sin(angle) * dist;
            }
            foods.push({
                x, y, baseX: x, baseY: y,
                radius: isDrop ? 5 : 7,
                char: codeSymbols[Math.floor(Math.random() * codeSymbols.length)],
                offset: Math.random() * 10
            });
        }

        function spawnParticles(x, y, color, amount = 8) {
            for (let i = 0; i < amount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1, color });
            }
        }

        class Bot {
            constructor() {
                const maxDim = Math.max(width, height);
                const ang = Math.random() * Math.PI * 2;
                const dist = maxDim * 0.7 + Math.random() * (maxDim * 0.4);
                this.x = player.x + Math.cos(ang) * dist;
                this.y = player.y + Math.sin(ang) * dist;
                this.radius = 6; // Inimigos começam menores
                this.speed = BASE_SPEED * (0.7 + Math.random() * 0.4);
                this.angle = ang + Math.PI;
                this.segments = Array(5).fill().map(() => ({x: this.x, y: this.y}));
                this.score = 0;
                this.dead = false;
            }
            update() {
                if(this.dead) return;
                
                const maxDim = Math.max(width, height);
                if (Math.hypot(player.x - this.x, player.y - this.y) > maxDim * 1.6) {
                    const ang = Math.random() * Math.PI * 2;
                    const dist = maxDim * 0.8 + Math.random() * (maxDim * 0.3);
                    this.x = player.x + Math.cos(ang) * dist;
                    this.y = player.y + Math.sin(ang) * dist;
                    for(let seg of this.segments) { seg.x = this.x; seg.y = this.y; }
                }

                let nearest = null; let minDist = 200; // Raio de visão limitado, impede devorar o mapa
                for(let f of foods) {
                    let d = Math.hypot(f.x - this.x, f.y - this.y);
                    if(d < minDist) { minDist = d; nearest = f; }
                }

                if(nearest) {
                    let desiredAngle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
                    let diff = desiredAngle - this.angle;
                    this.angle += Math.max(-0.1, Math.min(0.1, Math.atan2(Math.sin(diff), Math.cos(diff))));
                } else {
                    // Se não ver comida, vaga aleatoriamente
                    this.angle += (Math.random() - 0.5) * 0.1;
                }

                // Inimigos não ficam tão gigantes
                this.radius = 6 + Math.min(6, Math.floor(this.score / 80));
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                let px = this.x, py = this.y;
                for (let seg of this.segments) {
                    let d = Math.hypot(px - seg.x, py - seg.y);
                    if (d > 7) {
                        seg.x += (px - seg.x) / d * (d - 7) * 0.6;
                        seg.y += (py - seg.y) / d * (d - 7) * 0.6;
                    }
                    px = seg.x; py = seg.y;
                }

                for (let i = foods.length - 1; i >= 0; i--) {
                    if (Math.hypot(this.x - foods[i].x, this.y - foods[i].y) < this.radius + 10) {
                        foods.splice(i, 1);
                        this.score += 20;
                        this.segments.push({...this.segments[this.segments.length-1]});
                    }
                }
            }
            die() {
                if(this.dead) return;
                this.dead = true;
                spawnParticles(this.x, this.y, '#ff3355', 15);
                this.segments.forEach(s => spawnFood(s.x, s.y, true));
            }
        }

        let updateTimer = 0;
        function update() {
            if (isDashing && player.score > 0) {
                player.speed = DASH_SPEED;
                player.score -= 0.5;
                if(player.score < 0) player.score = 0;
                scoreEl.innerText = Math.floor(player.score);
                if (player.segments.length > BASE_SEGMENTS + Math.floor(player.score/15)) {
                    let tail = player.segments.pop();
                    if(Math.random() < 0.2) spawnFood(tail.x, tail.y, true);
                }
            } else {
                player.speed = BASE_SPEED;
            }

            player.radius = 8 + Math.min(15, Math.floor(player.score / 40));
            const pDist = Math.hypot(target.x - player.x, target.y - player.y);
            if (pDist > 5) {
                player.x += (target.x - player.x) / pDist * player.speed;
                player.y += (target.y - player.y) / pDist * player.speed;
            }

            camera.x = player.x - width / 2;
            camera.y = player.y - height / 2;

            let px = player.x, py = player.y;
            const spacing = isDashing ? 11 : 7;
            for (let seg of player.segments) {
                let d = Math.hypot(px - seg.x, py - seg.y);
                if (d > spacing) {
                    seg.x += (px - seg.x) / d * (d - spacing) * 0.6;
                    seg.y += (py - seg.y) / d * (d - spacing) * 0.6;
                }
                px = seg.x; py = seg.y;
            }

            let t = Date.now() * 0.002;
            const maxDim = Math.max(width, height);
            
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                f.y = f.baseY + Math.sin(t + f.offset) * 3;
                
                let dist = Math.hypot(player.x - f.x, player.y - f.y);
                
                if (dist > maxDim * 1.6) {
                    foods.splice(i, 1);
                    const ang = Math.random() * Math.PI * 2;
                    const newDist = maxDim * 1.0 + Math.random() * (maxDim * 0.4);
                    spawnFood(player.x + Math.cos(ang) * newDist, player.y + Math.sin(ang) * newDist);
                    continue;
                }
                
                if (dist < player.radius + f.radius) {
                    spawnParticles(f.x, f.y, '#00ff66', 3);
                    foods.splice(i, 1);
                    player.score += 10;
                    scoreEl.innerText = Math.floor(player.score);
                    player.segments.push({...player.segments[player.segments.length-1]});
                    if(foods.length < MAX_FOOD) spawnFood();
                } else if (dist < MAGNET_RADIUS) {
                    f.x += (player.x - f.x) * 0.1;
                    f.y += (player.y - f.y) * 0.1;
                    f.baseX = f.x; f.baseY = f.y;
                }
            }

            bots = bots.filter(b => !b.dead);
            while(bots.length < MAX_BOTS) bots.push(new Bot());

            for (let bot of bots) {
                bot.update();
                
                for (let seg of player.segments) {
                    if (Math.hypot(bot.x - seg.x, bot.y - seg.y) < bot.radius + player.radius*0.7) {
                        bot.die(); break;
                    }
                }

                if(!bot.dead && gameState === 'PLAYING') {
                    for (let seg of bot.segments) {
                        if (Math.hypot(player.x - seg.x, player.y - seg.y) < player.radius + bot.radius*0.7) {
                            gameOver(); break;
                        }
                    }
                    if (Math.hypot(player.x - bot.x, player.y - bot.y) < player.radius + bot.radius) {
                        bot.die(); gameOver();
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            updateTimer++;
            if(updateTimer > 120) { updateFirebaseScore(); updateTimer = 0; }
        }

        function draw() {
            ctx.fillStyle = '#010503';
            ctx.fillRect(0, 0, width, height);
            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            ctx.strokeStyle = 'rgba(0, 255, 102, 0.05)';
            ctx.lineWidth = 1;
            const sx = Math.floor(camera.x / GRID_SIZE) * GRID_SIZE;
            const sy = Math.floor(camera.y / GRID_SIZE) * GRID_SIZE;
            ctx.beginPath();
            for (let x = sx; x < sx + width + GRID_SIZE; x += GRID_SIZE) {
                ctx.moveTo(x, sy); ctx.lineTo(x, sy + height + GRID_SIZE);
            }
            for (let y = sy; y < sy + height + GRID_SIZE; y += GRID_SIZE) {
                ctx.moveTo(sx, y); ctx.lineTo(sx + width + GRID_SIZE, y);
            }
            ctx.stroke();

            ctx.font = '12px "Share Tech Mono"';
            for (let f of foods) {
                ctx.fillStyle = '#88ccaa';
                ctx.fillText(f.char, f.x - 4, f.y + 4);
            }

            for (let p of particles) {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            }
            ctx.globalAlpha = 1.0;

            for (let bot of bots) {
                for (let i = bot.segments.length - 1; i >= 0; i--) {
                    const seg = bot.segments[i];
                    ctx.fillStyle = '#330011';
                    ctx.strokeStyle = '#ff3355';
                    ctx.lineWidth = 2;
                    let s = bot.radius * (1 - (i/bot.segments.length)*0.3);
                    ctx.fillRect(seg.x-s, seg.y-s, s*2, s*2);
                    ctx.strokeRect(seg.x-s, seg.y-s, s*2, s*2);
                }
            }

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                for (let i = player.segments.length - 1; i >= 0; i--) {
                    const seg = player.segments[i];
                    const s = player.radius * (1 - (i/player.segments.length)*0.4);
                    ctx.fillStyle = gameState === 'GAMEOVER' ? '#222' : '#002211';
                    ctx.strokeStyle = gameState === 'GAMEOVER' ? '#555' : (isDashing ? '#ffcc00' : '#00ff66');
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(seg.x, seg.y - s); ctx.lineTo(seg.x + s, seg.y);
                    ctx.lineTo(seg.x, seg.y + s); ctx.lineTo(seg.x - s, seg.y);
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();
                }
                
                ctx.fillStyle = gameState === 'GAMEOVER' ? '#555' : '#00ff66';
                ctx.beginPath();
                ctx.moveTo(player.x, player.y - player.radius - 2); 
                ctx.lineTo(player.x + player.radius + 2, player.y);
                ctx.lineTo(player.x, player.y + player.radius + 2); 
                ctx.lineTo(player.x - player.radius - 2, player.y);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        function gameLoop() {
            if (gameState === 'PLAYING') update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            if(gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';
            isDashing = false;
            
            if (player.score > personalBest) personalBest = Math.floor(player.score);
            
            document.getElementById('go-score').innerText = Math.floor(player.score);
            document.getElementById('go-personal-best').innerText = personalBest;
            document.getElementById('go-global-best').innerText = Math.max(globalBest, personalBest);
            
            document.getElementById('game-over').style.display = 'flex';
            updateFirebaseScore(true);
        }

        function updateFirebaseScore(isDeath = false) {
            if (!playerDocRef) return;
            playerDocRef.set({
                nickname: myNickname,
                score: isDeath ? 0 : Math.floor(player.score),
                bestScore: personalBest,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(()=>{});
        }

        function heartbeat() {
            if (gameState === 'PLAYING' && playerDocRef) {
                playerDocRef.update({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
            }
        }

        function initRealtimeRanking() {
            db.collection("players").orderBy("bestScore", "desc").limit(5).onSnapshot((snap) => {
                let pData = [];
                snap.forEach(doc => {
                    const d = doc.data();
                    let on = false;
                    if(d.lastSeen && d.lastSeen.toDate) {
                        on = (Date.now() - d.lastSeen.toDate().getTime()) < 20000;
                    }
                    if (d.nickname === myNickname && gameState === 'PLAYING') on = true;
                    
                    let s = on ? Math.floor(d.score||0) : Math.floor(d.bestScore||0);
                    if (Math.floor(d.bestScore||0) > globalBest) globalBest = Math.floor(d.bestScore);
                    pData.push({ nick: d.nickname, score: s, on });
                });

                pData.sort((a,b) => b.score - a.score);
                rankingList.innerHTML = "";
                pData.forEach(p => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${p.nick.substring(0,6)} ${p.on ? '<span style="color:#00ff66">●</span>' : '<span style="color:#666">○</span>'}</span> <span>${p.score}</span>`;
                    if(p.nick === myNickname) li.style.color = '#ffcc00';
                    rankingList.appendChild(li);
                });
            });
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
